name: Fantasy integration / QA
on:
  push:
    branches: [work/fantasy-all-8-20261101]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image build tools
        run: python -m pip install pillow numpy
      - name: Restore reviewed fantasy code patch
        run: |
          cat scripts/bootstrap_patch.part*.txt | base64 -d > /tmp/patch.deflate
          python - <<'PY'
          import zlib
          from pathlib import Path
          Path('/tmp/fantasy.patch').write_bytes(zlib.decompress(Path('/tmp/patch.deflate').read_bytes()))
          PY
          patch -p1 < /tmp/fantasy.patch
      - name: Generate five maps, terrain and sprites from original images
        run: |
          python scripts/build-fantasy-maps.py
          python - <<'PY'
          from pathlib import Path
          # Remove repeated generated imports (the patch already registered these five maps).
          p=Path('src/maps/index.js')
          lines=p.read_text().splitlines()
          unique=[];seen=set()
          for line in lines:
              if line.startswith('import { MAP as fantasy_'):
                  if line in seen:continue
                  seen.add(line)
              unique.append(line)
          p.write_text('\n'.join(unique)+'\n')
          script=Path('scripts/build-fantasy-maps.py')
          content=script.read_text()
          content=content.replace("for mid,_ in NAMES:s=s.replace(", "for mid,_ in NAMES:\n if f\"import {{ MAP as {mid} }}\" in s: continue\n s=s.replace(")
          script.write_text(content)
          PY
          python scripts/ingest-fantasy-tiles.py
          python scripts/ingest-fantasy-art.py
      - run: npm test
      - run: npm run build
      - name: Install Chromium for real-browser E2E
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Play through browser E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fantasy-real-browser-screenshots
          path: qa/screens
      - name: Commit completed and tested sources to staging branch
        run: |
          rm -f scripts/bootstrap_patch.part*.txt
          rm -f .github/workflows/fantasy-build.yml
          git add -A
          git config user.name "vtn-fantasy-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: fantasy kingdom stages 1-8, 5 maps, paperdolls and QA"
          git push origin HEAD:work/fantasy-all-8-20261101
