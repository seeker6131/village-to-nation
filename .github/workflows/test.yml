name: Test prototype
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: npm run build && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screens
          path: qa/screens
