name: Test prototype
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: npm run build && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screens
          path: qa/screens

  source-snapshot:
    if: github.event_name == 'pull_request' && github.head_ref == 'work/fantasy-all-8-20261101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle source and fantasy images for development QA
        run: tar -czf /tmp/vtn-source.tar.gz src scripts tests docs assets source_art/fantasy source_art/v030 maps editor rig index.html package.json CLAUDE.md README.md .github
      - uses: actions/upload-artifact@v4
        with:
          name: vtn-source-snapshot
          path: /tmp/vtn-source.tar.gz
          retention-days: 2
