name: Rig Maker APK
on:
  push:
    branches: [main]
    paths: ['rig/**', 'android/**', '.github/workflows/rig-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Copy the rig app into the APK
        run: |
          W=android/app/src/main/assets/www
          mkdir -p $W/rig
          cp rig/index.html rig/demo.js $W/rig/
      - name: Build APK
        run: |
          set -o pipefail
          gradle -p android assembleRigRelease --no-daemon --stacktrace 2>&1 | tee build.log || { grep -E 'error:|What went wrong|FAILURE|Exception|>' build.log | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Rename
        run: cp android/app/build/outputs/apk/rig/release/app-rig-release.apk V2N-RigMaker.apk
      - uses: actions/upload-artifact@v4
        with: { name: V2N-RigMaker, path: V2N-RigMaker.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rig-v${{ github.run_number }}
          name: V2N Rig Maker ${{ github.run_number }}
          body: แอปใส่กระดูกตัวละคร V2N (Android) — ดาวน์โหลด V2N-RigMaker.apk แล้วติดตั้ง
          files: V2N-RigMaker.apk
          make_latest: false
