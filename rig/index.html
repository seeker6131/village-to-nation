<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>V2N Rig Maker</title>
<style>
:root{--bg:#121620;--panel:#1b2130;--panel2:#252d3d;--line:#344057;--tx:#e9edf5;--mut:#91a0b9;--acc:#ffb547;--acc2:#5cc8ff;--bad:#ff6b6b;--ok:#6be08a}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,"Noto Sans Thai","Leelawadee UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-height:34px;cursor:pointer;white-space:nowrap}
button.on{background:var(--acc);color:#1b1205;border-color:var(--acc)}
button.pri{background:var(--acc2);color:#04131c;border-color:var(--acc2);font-weight:600}
button.bad{border-color:#7a3340}
button:disabled{opacity:.35}
input,select{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 7px;min-height:34px}
input[type=number]{width:62px}
input[type=range]{padding:0}
label{display:inline-flex;align-items:center;gap:5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;min-height:32px}
#app{display:grid;height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "tl" "side"}
@media (min-aspect-ratio:5/4){#app{grid-template-columns:minmax(0,1fr) 290px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "stage side" "tl side"}}
#top{grid-area:top;display:flex;gap:6px;align-items:center;padding:6px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;min-width:0;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#pname{max-width:150px;overflow:hidden;text-overflow:ellipsis;font-weight:600;padding:0 4px;cursor:pointer;flex:none}
.sp{flex:1 1 0;min-width:4px}
#stage{grid-area:stage;position:relative;min-height:0;overflow:hidden;background:#171c27}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:8px;top:8px;right:8px;pointer-events:none;color:var(--mut);font-size:12px;text-shadow:0 1px 2px #000}
#pick{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--acc);color:#1b1205;padding:6px 10px;border-radius:10px;display:flex;gap:8px;align-items:center;font-weight:600;z-index:3}
#pick button{min-height:28px;padding:2px 8px}
#selbar{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:5px;flex-wrap:wrap;justify-content:center;pointer-events:none;z-index:2}
#selbar>*{pointer-events:auto}
#selbar .lbl{background:#000a;padding:6px 8px;border-radius:8px;align-self:center;max-width:140px;overflow:hidden;text-overflow:ellipsis}
#selbar button{background:#252d3dee}
#selbar button.pri{background:var(--acc2)}
#selbar button.bad{background:#3a1d24ee}
@media (max-width:600px){#selbar button{min-height:32px;padding:3px 8px}}
#prev{position:absolute;right:8px;top:8px;background:#0b0e14cc;border:1px solid var(--line);border-radius:10px;padding:4px;text-align:center;font-size:11px;color:var(--mut)}
#prev canvas{display:block;image-rendering:pixelated;width:120px;height:120px;background:repeating-conic-gradient(#2a3140 0 25%,#222836 0 50%) 0 0/12px 12px;border-radius:6px}
#prev.big canvas{width:200px;height:200px}
#tl{grid-area:tl;background:var(--panel);border-top:1px solid var(--line);padding:5px 6px;display:none;flex-direction:column;gap:5px;min-width:0}
#tl.show{display:flex}
#tl .row{display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none}
#tl .row::-webkit-scrollbar{display:none}
#frames{display:flex;gap:2px;overflow-x:auto;padding-bottom:2px;touch-action:pan-x}
#frames .f{flex:none;width:30px;height:34px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--mut);cursor:pointer;position:relative}
#frames .f.cur{border-color:var(--acc);color:var(--tx);background:#3a3222}
#frames .f i{width:9px;height:9px;transform:rotate(45deg);margin-top:2px;background:transparent}
#frames .f.k i{background:var(--acc2)}
#frames .f.ka i{background:#56657f}
#flabel{min-width:58px;text-align:center;color:var(--mut)}
#side{grid-area:side;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
@media (max-aspect-ratio:5/4){#side{height:33vh;border-left:0;border-top:1px solid var(--line)}#side.min{height:auto}#side.min .body{display:none}}
#tabs{display:flex;gap:4px;padding:5px;border-bottom:1px solid var(--line)}
#tabs button{flex:1}
#side .body{flex:1;overflow-y:auto;padding:6px;min-height:0}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.th{background:repeating-conic-gradient(#2a3140 0 25%,#222836 0 50%) 0 0/10px 10px;border:1px solid var(--line);border-radius:8px;height:86px;position:relative;display:flex;flex-direction:column;cursor:pointer;overflow:hidden}
.th img{flex:1;min-height:0;object-fit:contain;image-rendering:pixelated;padding:4px;pointer-events:none}
.th span{font-size:10px;background:#000a;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th b{position:absolute;top:2px;right:2px;background:#000b;border-radius:6px;padding:0 5px;font-weight:400;font-size:12px}
.th.used{outline:2px solid #3d7a52}
.row2{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:7px;cursor:pointer;min-height:34px}
.row2:hover{background:#ffffff08}
.row2.sel{background:#3a3222;outline:1px solid var(--acc)}
.row2 .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row2 small{color:var(--mut)}
.row2 button{min-height:28px;padding:2px 7px}
h4{margin:10px 2px 6px;color:var(--mut);font-weight:600;font-size:12px}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.muted{color:var(--mut);font-size:12px}
#menu{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:220px;box-shadow:0 8px 30px #0008}
#menu button{text-align:left;border:0;background:transparent}
#menu button:hover{background:var(--panel2)}
.modal{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:center;justify-content:center;padding:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 10px 40px #000a}
.card h3{margin:0 0 8px}
.card p{margin:6px 0;color:#c9d2e3}
#imp .card{max-width:min(1000px,100%);width:100%;height:100%;display:flex;flex-direction:column;gap:6px;padding:10px}
#impwrap{flex:1;min-height:0;overflow:auto;background:repeating-conic-gradient(#2a3140 0 25%,#222836 0 50%) 0 0/16px 16px;border-radius:8px;position:relative}
#impcv{display:block;touch-action:pan-x pan-y}
#impcv.draw{touch-action:none}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#toast{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 14px;border-radius:12px;z-index:50;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
#welcome{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;z-index:4}
#welcome .card{text-align:center}
#welcome .btns{justify-content:center}
pre.prompt{white-space:pre-wrap;background:#0d1118;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;user-select:text;-webkit-user-select:text}
ol{padding-left:20px;margin:6px 0} li{margin:3px 0}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="bMenu" title="เมนู">☰</button>
    <span id="pname" title="แตะเพื่อเปลี่ยนชื่อ">ตัวละครใหม่</span>
    <select id="selView" title="มุมมอง">
      <option value="front">มุม: หน้า</option><option value="side">มุม: ข้าง</option><option value="back">มุม: หลัง</option>
    </select>
    <div class="seg" id="segMode"><button data-m="setup" class="on">🦴 ตั้งโครง</button><button data-m="anim">🎬 ทำท่า</button></div>
    <div class="seg" id="segEdit"><button data-e="part" class="on" title="แก้ชิ้นส่วน">✋ ชิ้น</button><button data-e="bone" title="แก้กระดูก">🦴 กระดูก</button><button data-e="newbone" title="ลากเพื่อวาดกระดูกใหม่">✏️ วาดกระดูก</button></div>
    <div class="sp"></div>
    <button id="bBones" class="on" title="แสดงกระดูก">👁 กระดูก</button>
    <button id="bUndo" title="ย้อน (Ctrl+Z)">↶</button><button id="bRedo" title="ทำซ้ำ (Ctrl+Y)">↷</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="prev" title="ขนาดจริงในเกม (แตะเพื่อขยาย)"><canvas id="pcv" width="80" height="80"></canvas><div>ขนาดในเกม</div></div>
    <div id="pick" hidden><span id="pickTx"></span><button id="pickX">ยกเลิก</button></div>
    <div id="selbar"></div>
    <div id="welcome" hidden>
      <div class="card">
        <h3>V2N Rig Maker 🦴</h3>
        <p>ใส่กระดูกให้ตัวละคร ทำท่าเดิน/ยืน/ทำงาน แล้วส่งไฟล์ให้ Claude เอาเข้าเกม</p>
        <div class="btns">
          <button class="pri" id="wAuto">⚡ รูปจาก GPT → ใส่กระดูกอัตโนมัติ</button>
          <button id="wDemo">🧍 ลองตัวอย่าง</button>
          <button id="wImp">🖼️ นำเข้ารูป (ทำเอง)</button>
          <button id="wOpen">📂 เปิดไฟล์ .v2nrig.json</button>
          <button id="wHelp">❔ วิธีใช้</button>
        </div>
      </div>
    </div>
  </div>
  <div id="tl">
    <div class="row">
      <button id="tPlay" title="เล่น/หยุด (Space)">▶</button>
      <button id="tPrev" title="เฟรมก่อน (←)">◀</button><span id="flabel">1/8</span><button id="tNext" title="เฟรมถัดไป (→)">▶|</button>
      <label class="muted">fps<input id="tFps" type="number" min="1" max="60"></label>
      <label class="muted">เฟรม<input id="tLen" type="number" min="1" max="120"></label>
      <button id="tLoop" title="วนลูป">🔁</button>
      <button id="tOnion" title="เงาเฟรมก่อน/หลัง">🧅</button>
      <button id="tIK" title="IK: ลากมือ/เท้า แล้วข้อศอก/เข่างอตาม">🦾 IK</button>
    </div>
    <div class="row">
      <button id="tKey" title="ใส่คีย์ (K)">◆ คีย์</button>
      <button id="tKeyAll" title="คีย์ทั้งตัว">◆ ทั้งตัว</button>
      <button id="tDel" title="ลบคีย์">✕ คีย์</button>
      <button id="tCopy" title="ก๊อปท่าเฟรมนี้">📋 ก๊อป</button>
      <button id="tPaste" title="วางท่า">📥 วาง</button>
      <button id="tSwap" title="สลับท่าซ้าย-ขวา">⇄ สลับข้าง</button>
      <button id="tHalf" title="ข้างคู่ทำตามแบบเหลื่อมครึ่งรอบ (ทำเดิน)">½ เหลื่อม</button>
      <button id="tEase" title="ความนุ่มของคีย์">〰 นุ่ม</button>
    </div>
    <div id="frames"></div>
  </div>
  <div id="side">
    <div id="tabs"><button data-t="parts" class="on">🧩 ชิ้นส่วน</button><button data-t="bones">🦴 กระดูก</button><button data-t="anims">🎬 ท่า</button></div>
    <div class="body" id="sbody"></div>
  </div>
</div>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fJson" accept=".json,.v2nrig,application/json" hidden>
<div id="toast"></div>
<script src="demo.js"></script>
<script>
'use strict';
// ====================================================================== utils
const $ = s => document.querySelector(s);
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let _uid = Date.now() % 1e6;
const uid = p => p + (++_uid).toString(36);
const I = [1, 0, 0, 1, 0, 0];
const mul = (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
const T = (x, y) => [1, 0, 0, 1, x, y];
const R = a => { const c = Math.cos(a), s = Math.sin(a); return [c, s, -s, c, 0, 0]; };
const S = (x, y) => [x, 0, 0, y, 0, 0];
const inv = m => { const d = m[0] * m[3] - m[1] * m[2] || 1e-9; return [m[3] / d, -m[1] / d, -m[2] / d, m[0] / d, (m[2] * m[5] - m[3] * m[4]) / d, (m[1] * m[4] - m[0] * m[5]) / d]; };
const ap = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
const ang = m => Math.atan2(m[1], m[0]);
const normDeg = a => { a = ((a + 180) % 360 + 360) % 360 - 180; return a; };
const r2 = v => Math.round(v * 100) / 100;
function toast(t, ms = 2200) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), ms); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ====================================================================== project
const VIEWS = ['front', 'side', 'back'];
const VIEW_TH = { front: 'หน้า', side: 'ข้าง', back: 'หลัง' };
const README = 'V2N rig file. World units = art px; origin (0,0) = between the feet on the ground, +y down. ' +
  'Bone: x,y = origin in the parent bone frame (root: world), rot = degrees clockwise, the bone points along its local +x, len = length. ' +
  'Children are placed in the parent frame; bone scale (key s) stretches only that bone along its axis (not inherited). ' +
  'Part: an image drawn centred at (x,y) in its bone frame, rotated rot degrees, scaled sx/sy (flip = mirror x), bright = brightness; array order = draw order (first = back). ' +
  'Anim keys per bone: f = frame, r/x/y = deltas added to the setup pose, s = length scale, e = "s" smooth or "l" linear; loop anims wrap last->first. ' +
  'Side view faces left; the game makes "right" by mirroring it. export: targetH = character height in game sprite px, cell = frame size, feet = ground line y in the cell.';
function blankProject() {
  return { format: 'v2n-rig', version: 1, name: 'ตัวละครใหม่', readme: README, images: {},
    views: { front: { bones: [], parts: [] }, side: { bones: [], parts: [] }, back: { bones: [], parts: [] } },
    anims: [], export: { targetH: 62, cell: 80, feet: 76, outline: true, mirrorSide: true } };
}
let P = blankProject();
const ui = { view: 'side', mode: 'setup', edit: 'part', sel: null, anim: null, frame: 0, playing: false, onion: false, ik: true,
  showBones: true, tab: 'parts', pick: null, clip: null, prevBig: false };
const IMG = {}; // id -> {el, w, h, ready, alpha}
const V = () => P.views[ui.view];
const boneById = id => V().bones.find(b => b.id === id);
const partById = id => V().parts.find(p => p.id === id);
const curAnim = () => P.anims.find(a => a.id === ui.anim && a.view === ui.view) || null;

function loadImage(id) {
  const rec = P.images[id]; if (!rec) return;
  const o = IMG[id] = { el: new Image(), w: rec.w, h: rec.h, ready: false, alpha: null };
  o.el.onload = () => {
    o.w = o.el.naturalWidth; o.h = o.el.naturalHeight; rec.w = o.w; rec.h = o.h;
    const c = document.createElement('canvas'); c.width = o.w; c.height = o.h; const x = c.getContext('2d'); x.drawImage(o.el, 0, 0);
    try { const d = x.getImageData(0, 0, o.w, o.h).data; o.alpha = new Uint8Array(o.w * o.h); for (let i = 0; i < o.alpha.length; i++) o.alpha[i] = d[i * 4 + 3]; } catch (e) { }
    o.ready = true; dirty(); renderSide();
  };
  o.el.src = rec.src;
}
function addImage(name, src, w, h) { const id = uid('img'); P.images[id] = { name, w, h, src }; loadImage(id); return id; }

// ====================================================================== undo + autosave
const UN = { stack: [], redo: [] };
const snap = () => JSON.stringify({ name: P.name, views: P.views, anims: P.anims, export: P.export });
function pushUndo() { UN.stack.push(snap()); if (UN.stack.length > 80) UN.stack.shift(); UN.redo.length = 0; }
function restore(s) { const o = JSON.parse(s); Object.assign(P, o); fixSel(); refresh(); }
function undo() { if (!UN.stack.length) return; UN.redo.push(snap()); restore(UN.stack.pop()); changed(false); }
function redo() { if (!UN.redo.length) return; UN.stack.push(snap()); restore(UN.redo.pop()); changed(false); }
function fixSel() {
  if (ui.sel && !(ui.sel.kind === 'bone' ? boneById(ui.sel.id) : partById(ui.sel.id))) ui.sel = null;
  if (!curAnim()) { const a = P.anims.find(a => a.view === ui.view); ui.anim = a ? a.id : null; }
  const A = curAnim(); if (A) ui.frame = clamp(ui.frame, 0, A.frames - 1); else ui.frame = 0;
}
let saveT = 0;
function changed(undoable = true) { dirty(); clearTimeout(saveT); saveT = setTimeout(autosave, 700); renderSide(); renderTL(); renderSel(); }
const DB = { db: null };
function idb() {
  return new Promise(res => {
    if (DB.db) return res(DB.db);
    try { const r = indexedDB.open('v2n-rig', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(DB.db = r.result); r.onerror = () => res(null); } catch (e) { res(null); }
  });
}
async function autosave() { try { const db = await idb(); if (!db) return; db.transaction('kv', 'readwrite').objectStore('kv').put(JSON.stringify(P), 'current'); } catch (e) { } }
async function autoload() {
  try { const db = await idb(); if (!db) return null; return await new Promise(res => { const r = db.transaction('kv').objectStore('kv').get('current'); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); } catch (e) { return null; }
}
function loadProject(o) {
  if (!o || o.format !== 'v2n-rig') { toast('ไม่ใช่ไฟล์ rig ของ V2N'); return false; }
  const b = blankProject(); P = Object.assign(b, o); P.readme = README;
  for (const v of VIEWS) P.views[v] = Object.assign({ bones: [], parts: [] }, P.views[v] || {});
  P.export = Object.assign(blankProject().export, o.export || {});
  for (const k in IMG) delete IMG[k];
  for (const id in P.images) loadImage(id);
  UN.stack.length = 0; UN.redo.length = 0; ui.sel = null; ui.anim = null; ui.frame = 0;
  if (!VIEWS.some(v => P.views[v].parts.length || P.views[v].bones.length)) ui.view = 'side';
  else if (!P.views[ui.view].parts.length) ui.view = VIEWS.find(v => P.views[v].parts.length) || ui.view;
  fixSel(); refresh(); refit(); autosave(); return true;
}

// ====================================================================== pose
function interp(keys, f, frames, loop) {
  if (!keys || !keys.length) return null;
  let k0 = null, k1 = null;
  for (const k of keys) { if (k.f <= f) k0 = k; else { k1 = k; break; } }
  let f0, f1;
  if (!k0) { if (!loop) return keys[0]; k0 = keys[keys.length - 1]; f0 = k0.f - frames; } else f0 = k0.f;
  if (!k1) { if (!loop || keys.length === 1) return k0; k1 = keys[0]; f1 = k1.f + frames; } else f1 = k1.f;
  if (f0 === f) return k0;
  let t = (f - f0) / (f1 - f0 || 1); if (k0.e !== 'l') t = t * t * (3 - 2 * t);
  const L = (a, b) => a + (b - a) * t;
  return { r: L(k0.r, k1.r), x: L(k0.x, k1.x), y: L(k0.y, k1.y), s: L(k0.s ?? 1, k1.s ?? 1) };
}

  const T0 = ap(BM.Ms[b.id], b.len, 0);

function sheetRows() {

    rows.push({ A, view: v, dir: v === 'front' ? 'down' : v === 'back' ? 'up' : 'left', mirror: false });
    if (v === 'side' && P.export.mirrorSide) rows.push({ A, view: v, dir: 'right', mirror: true });
  }
  // a view with parts but no anim -> one still row
  for (const v of VIEWS) if (P.views[v].parts.length && !P.anims.some(a => a.view === v)) {
    rows.push({ A: null, view: v, dir: v === 'front' ? 'down' : v === 'back' ? 'up' : 'left', mirror: false });
    if (v === 'side' && P.export.mirrorSide) rows.push({ A: null, view: v, dir: 'right', mirror: true });

  return rows;
}

HUMAN.back = HUMAN.front.map(([n, p, o, t]) => [n, p, [-o[0], o[1]], [-t[0], t[1]]]);
async function addHumanoid() {
  if (V().bones.length) { const v = await ask({ title: 'มีกระดูกอยู่แล้ว', text: 'เพิ่มโครงคนทับเข้าไปอีกชุด?', buttons: ['เพิ่ม', 'ยกเลิก'] }); if (!v) return; }

function buildHumanoid(view, k) {
  const ids = {};
  // body height: from the assembled body (5+ parts), else from the biggest part (a head is ~1/3 of the body)
  let sc = k;
  if (P.views[view].parts.length >= 5) sc = charBox(view).h / 248;
  else { const hs = (P.views[view].parts.length ? P.views[view].parts.map(p => P.images[p.img]) : Object.values(P.images)).map(r => r && r.h || 0); const mh = Math.max(0, ...hs); if (mh) sc = mh / .33 / 248; }
  for (const [n, p, o, t] of HUMAN[view]) { const b = addBoneWorld(view, n, p ? ids[p] : null, [o[0] * sc, o[1] * sc], [t[0] * sc, t[1] * sc]); ids[n] = b.id; }
  return ids;
}
function autoWalk(A, quiet) {
  const by = n => V().bones.find(b => b.name === n); const W = A.frames || 8;
  if (!quiet) pushUndo(); let n = 0; A.keys = {};
  const put = (name, f, v) => { const b = by(name); if (!b) return; (A.keys[b.id] ||= []).push({ f, r: r2(v.r || 0), x: r2(v.x || 0), y: r2(v.y || 0), s: r2(v.s ?? 1), e: 'l' }); n++; };
  const sc = charBox(ui.view).h / 248;
  for (let f = 0; f < W; f++) {
    const p = f / W * Math.PI * 2, S_ = Math.sin, C_ = Math.cos;
    if (ui.view === 'side') {
      const leg = ph => { const th = 26 * D2R * S_(ph), knee = (6 + 40 * Math.max(0, C_(ph))) * D2R; return { th, knee, foot: -(th - knee) * .8 * .5 - (th - knee) }; };
      const arm = ph => { const a = 22 * D2R * S_(ph); return { up: a, fore: (10 + 16 * Math.max(0, S_(ph))) * D2R }; };
      const N = leg(p), F = leg(p + Math.PI), aN = arm(p + Math.PI), aF = arm(p);
      // body height from the lowest ankle
      const Lt = by('ต้นขา_ใกล้')?.len || 50 * sc, Ls = by('หน้าแข้ง_ใกล้')?.len || 25 * sc;
      const ank = L => Lt * Math.cos(L.th) + Ls * Math.cos(L.th - L.knee);
      const drop = Lt + Ls - Math.max(ank(N), ank(F));
      put('สะโพก', f, { y: drop }); put('ลำตัว', f, { r: -1.5 }); put('หัว', f, { r: 1.5 * S_(2 * p - .9) });
      for (const [s, L] of [['ใกล้', N], ['ไกล', F]]) { put('ต้นขา_' + s, f, { r: L.th * R2D }); put('หน้าแข้ง_' + s, f, { r: -L.knee * R2D }); put('เท้า_' + s, f, { r: L.foot * R2D }); }
      for (const [s, a] of [['ใกล้', aN], ['ไกล', aF]]) { put('แขนบน_' + s, f, { r: a.up * R2D }); put('แขนล่าง_' + s, f, { r: a.fore * R2D }); }
    } else {
      const lift = ph => Math.max(0, S_(ph)), sw = ph => S_(ph), sg = ui.view === 'front' ? 1 : -1;
      put('สะโพก', f, { y: -1.5 * sc * Math.abs(S_(p)), x: 2 * sc * S_(p) });
      put('หัว', f, { r: 1 * S_(2 * p - .9) });

      put('แขนบน_ขวา', f, { r: 8 * sw(p + Math.PI) * sg }); put('แขนบน_ซ้าย', f, { r: 8 * sw(p) * sg });
      put('แขนล่าง_ขวา', f, { r: 6 * Math.max(0, sw(p + Math.PI)) * sg }); put('แขนล่าง_ซ้าย', f, { r: -6 * Math.max(0, sw(p)) * sg });
    }
  }
  for (const id in A.keys) A.keys[id].sort((a, b) => a.f - b.f);

  toast(n ? 'สร้างท่าเดินให้แล้ว — กด ▶ ดู แล้วปรับต่อได้' : 'ไม่เจอกระดูกชื่อแบบโครงคนสำเร็จรูป (กด 🧍 โครงคนสำเร็จรูปก่อน)', 3000);
}

window.addEventListener('keydown', e => {
